name: One-time ICYMI label patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-icymi-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace ICYMI label
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let content=fs.readFileSync(path,'utf8');
          const oldText='Big Dick Score';
          const newText='High Score of the Week';
          const matches=content.split(oldText).length-1;
          if(matches!==1) throw new Error('Expected exactly one Big Dick Score label; found '+matches);
          content=content.replace(oldText,newText);
          fs.writeFileSync(path,content);
          NODE
          git config user.name "CPBFFL Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rename weekly high-score label"
          git push
