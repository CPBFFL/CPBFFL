name: One-time Week 1 GOTW patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-week1-gotw.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock Week 1 Game of the Week
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let content = fs.readFileSync(path, 'utf8');
          const oldRank = ` function getPowerRank(owner){
             const pr = window.CPBFFL_POWER_RANKINGS;
             if(!Array.isArray(pr)) return null;
             const found = pr.find(x=>norm(x.owner)===norm(owner));
             return found ? Number(found.rank) : null;
           }`;
          const newRank = ` function getPowerRank(owner){
             const pr = window.CPBFFL_POWER_RANKINGS;
             if(Array.isArray(pr)){
               const found = pr.find(x=>norm(x.owner)===norm(owner));
               if(found) return Number(found.rank);
             }
             const preseasonRanks={
               "Matt Rennert":1,"Erik Mannarino":2,"Brian Corrigan":3,"Reid Masters":4,
               "Jake Stacy":5,"Shawn Smutak":6,"Paul Deutsch":7,"Michael Clark":8,
               "Tony Yokiel":9,"Steve Cegelka":10,"John DeBrouse":11,"Sam Young":12
             };
             const entry=Object.entries(preseasonRanks).find(([name])=>norm(name)===norm(owner));
             return entry ? entry[1] : null;
           }`;
          const oldBest = '   const best=scored[0];';
          const newBest = `   const publishedGotwId=window.CPBFFL_SHARED_DATA?.predictions?.[String(week)]?.gotw;
             const best=scored.find(x=>String(x.game.id)===String(publishedGotwId)) || scored[0];`;
          if (!content.includes(oldRank) || !content.includes(oldBest)) {
            throw new Error('Expected Game of the Week source blocks were not found.');
          }
          content = content.replace(oldRank, newRank).replace(oldBest, newBest);
          fs.writeFileSync(path, content);
          NODE
          git config user.name "CPBFFL Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Lock published Game of the Week"
          git push
