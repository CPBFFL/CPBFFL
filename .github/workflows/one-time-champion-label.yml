name: One-time champion label patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-champion-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add champion label
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let content=fs.readFileSync(path,'utf8');
          const marker='     const badges=(autoGotw.badges||[]).slice(0,3).join("  •  ");';
          const addition=`
             const owners=[g.a.owner,g.b.owner];
             const championLine=week===1 && owners.includes("Brian Corrigan") && owners.includes("Erik Mannarino")
               ? '🏆 2025 Champion vs. 2022 “Kind of” Champion'
               : "";`;
          const oldFragment='<strong>\${weekLabel(week)} • MARQUEE MATCHUP</strong>\${badges?';
          const newFragment='<strong>\${weekLabel(week)} • MARQUEE MATCHUP</strong>\${championLine?\`<br><strong>\${esc(championLine)}</strong>\`:""}\${badges?';
          if(content.split(marker).length-1!==1) throw new Error('Marquee badge marker was not unique.');
          if(content.split(oldFragment).length-1!==1) throw new Error('Marquee HTML marker was not unique.');
          content=content.replace(marker,marker+addition).replace(oldFragment,newFragment);
          fs.writeFileSync(path,content);
          NODE
          git config user.name "CPBFFL Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add champions context to Week 1 marquee"
          git push
