name: One-time Mike Clark H2H correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-mike-h2h.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Mike Clark career H2H
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let content=fs.readFileSync(path,'utf8');
          const match=content.match(/const CPBFFL_H2H = (\{[^\n]*\});/);
          if(!match) throw new Error('CPBFFL H2H data was not found.');
          const h2h=JSON.parse(match[1]);
          const records={
            "Sam Young":[8,7],
            "Matt Rennert":[0,0],
            "Shawn Smutak":[4,10],
            "Tony Yokiel":[3,8],
            "John DeBrouse":[4,5],
            "Paul Deutsch":[4,6],
            "Reid Masters":[0,0],
            "Brian Corrigan":[3,5],
            "Jake Stacy":[2,8],
            "Steve Cegelka":[2,2],
            "Erik Mannarino":[7,9]
          };
          const blank=()=>({wins:0,losses:0,pct:0,games:0,season:{},longestWin:0,longestLoss:0,currentType:"",currentLen:0,seasonUnassignedWins:0,seasonUnassignedLosses:0,seasonOverWins:0,seasonOverLosses:0});
          const setRecord=(a,b,w,l)=>{
            const key=a+"|"+b;
            const row=h2h[key]||blank();
            row.wins=w;
            row.losses=l;
            row.games=w+l;
            row.pct=row.games ? Math.round((w/row.games)*100) : 0;
            if(!row.games){
              Object.assign(row,blank());
            }
            h2h[key]=row;
          };
          for(const [opponent,[wins,losses]] of Object.entries(records)){
            setRecord("Michael Clark",opponent,wins,losses);
            setRecord(opponent,"Michael Clark",losses,wins);
          }
          content=content.replace(match[0],'const CPBFFL_H2H = '+JSON.stringify(h2h)+';');
          fs.writeFileSync(path,content);
          NODE
          git config user.name "CPBFFL Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Mike Clark career H2H records"
          git push
