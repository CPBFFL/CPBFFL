name: One-time Paul Erik H2H correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-paul-erik-h2h.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Paul Erik career H2H
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let content=fs.readFileSync(path,'utf8');
          const match=content.match(/const CPBFFL_H2H = (\{[^\n]*\});/);
          if(!match) throw new Error('CPBFFL H2H data was not found.');
          const h2h=JSON.parse(match[1]);
          const set=(key,wins,losses)=>{
            if(!h2h[key]) throw new Error('Missing H2H row: '+key);
            h2h[key].wins=wins;
            h2h[key].losses=losses;
            h2h[key].games=wins+losses;
            h2h[key].pct=Math.round((wins/(wins+losses))*100);
          };
          set("Paul Deutsch|Erik Mannarino",5,7);
          set("Erik Mannarino|Paul Deutsch",7,5);
          content=content.replace(match[0],'const CPBFFL_H2H = '+JSON.stringify(h2h)+';');
          fs.writeFileSync(path,content);
          NODE
          git config user.name "CPBFFL Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Paul and Erik career H2H"
          git push
